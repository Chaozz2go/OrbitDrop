name: Windows package
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Geprüftes Windows-Paket veröffentlichen'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: windows-package
  cancel-in-progress: true
env:
  QT_QPA_PLATFORM: offscreen
  # Only an explicit release commit or manual publish input makes a build public.
  PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release]')) || inputs.publish_release || false }}
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install wheel dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt "pyinstaller>=6,<7"
      - name: Bundle FFmpeg
        run: python -c "from media_setup import install_media; install_media()"
      - name: Add media tools to test PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\bin"
      - name: Bundle OCR languages
        if: hashFiles('ocr_data.py') != ''
        run: python -c "from ocr_data import install_languages; install_languages('tessdata')"
      - name: Windows regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and test frozen executable
        run: python windows_build.py
      - name: Test per-user installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/release/*-Setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'OrbitDropInstall'
          $install = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $report = Join-Path $env:RUNNER_TEMP 'installed-smoke.json'
          $test = Start-Process (Join-Path $target 'OrbitDrop.exe') -ArgumentList @('--self-test',"`"$report`"") -Wait -PassThru
          if ($test.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installed app failed' }
          if (-not (Get-Content $report | ConvertFrom-Json).ok) { throw 'Installed smoke checks failed' }
          Copy-Item $report dist/release/installed-smoke.json
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: OrbitDrop-Windows-x64
          path: dist/release/*
          if-no-files-found: warn
          retention-days: 30
      - name: Save tested package and publish explicitly requested releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from app_version import VERSION; print(VERSION)"
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              Write-Host "::notice::Release $tag is already published; existing assets remain unchanged. Increase the version for a new release."
              exit 0
            }
            gh release edit $tag --draft --target "$env:GITHUB_SHA" --title "OrbitDrop $version" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft metadata update failed' }
            gh release upload $tag dist/release/* --clobber
          } else {
            gh release create $tag dist/release/* --draft --target "$env:GITHUB_SHA" --title "OrbitDrop $version" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft package upload failed' }
          if ($env:PUBLISH_RELEASE -eq 'true') {
            gh release edit $tag --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }

